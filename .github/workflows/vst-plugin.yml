name: VST Plugin

on:
  push:
    branches: [main]
    tags: ['frogg3rs_vst']
    paths-ignore: ['openspec/**', 'README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['openspec/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # AU is Apple-only and app/vst/CMakeLists.txt requests FORMATS VST3 AU,
    # so this needs a macOS runner. Pinned to macos-14 (not "-latest") to
    # match desktop-release.yml's own macOS job and avoid silent drift when
    # GitHub moves the "latest" label.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # app/vst links Sheaf's synth core (External/Sheaf/projects/synth,
          # SHEAF_SYNTH_DIR in app/vst/CMakeLists.txt) -- same
          # `submodules: recursive` precedent pages.yml already uses for the
          # same submodule.
          submodules: recursive

      # app/vst/CMakeLists.txt requires a LOCAL JUCE checkout
      # (add_subdirectory("$ENV{HOME}/JUCE" ...), no FetchContent fallback --
      # deliberate, per that file's own header comment: "the group 5 brief's
      # explicit instruction (JUCE is already checked out locally), not
      # FetchContent"). A runner has no such checkout, so this step creates
      # one at the exact default path the CMakeLists.txt already looks up,
      # needing no -D override.
      #
      # app/vst's JUCE consumption has no pin of its own, so this pins to
      # 8.0.12 -- traced as the exact tag the local `~/JUCE` checkout this
      # app/vst suite is developed and passing against is at (`git describe
      # --tags --exact-match` on that checkout reports `8.0.12`), i.e. the
      # only JUCE version actually verified to build this plugin and pass
      # its own ctest suite.
      - name: Fetch JUCE (pinned, matches the locally-verified checkout)
        run: git clone --branch 8.0.12 --depth 1 https://github.com/juce-framework/JUCE.git "$HOME/JUCE"

      - name: Configure
        run: cmake -S app/vst -B app/vst/build -DCMAKE_BUILD_TYPE=Release

      # -j2, nice'd: matches this file's own binding build convention
      # (app/vst/CMakeLists.txt's header comment, "-j2 max, always, nice'd
      # -- this machine locks up above -j2") -- written for the operator's
      # local Mac, not this runner, but kept here too for parity with the
      # one documented invocation this project already commits to.
      # The default target builds the test executables only -- juce_add_plugin's
      # per-format targets are not part of `all`, so a plain build leaves no
      # bundles behind and the assertion below is what catches it. Name them.
      - name: Build (VST3 + AU)
        run: |
          nice -n 10 cmake --build app/vst/build --config Release -- -j2
          nice -n 10 cmake --build app/vst/build --config Release \
            --target FroggersVst_VST3 FroggersVst_AU -- -j2

      # Confirms both plugin bundle formats actually landed, not just that
      # the overall `cmake --build` exit code was 0 (the vst3/component
      # bundles are directories, produced by juce_add_plugin as part of the
      # FroggersVst target's normal build -- COPY_PLUGIN_AFTER_BUILD is
      # FALSE, so they stay in-tree here and are never installed anywhere).
      - name: Assert plugin bundles were built
        run: |
          test -d app/vst/build/FroggersVst_artefacts/Release/VST3/Frogg3rs.vst3
          test -d app/vst/build/FroggersVst_artefacts/Release/AU/Frogg3rs.component
          echo "VST3 and AU bundles present"

      # Five registered tests on macOS: FroggersVstSmokeTest,
      # FroggersVstHostTests, FroggersVstEditorTest, and one
      # FroggersVstDocsBundled per format. Previously never run in CI at all.
      - name: ctest
        run: ctest --test-dir app/vst/build --output-on-failure

      # A plugin bundle is a directory and a release asset is a file, so the
      # bundles are zipped here, on the macOS runner that built them, rather
      # than in the release job -- ditto preserves the bundle structure and
      # exists only on macOS.
      - name: Package plugin bundles
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd app/vst/build/FroggersVst_artefacts/Release
          ditto -c -k --keepParent VST3/Frogg3rs.vst3 Frogg3rs-VST3.zip
          ditto -c -k --keepParent AU/Frogg3rs.component Frogg3rs-AU.zip

      - name: Upload packaged bundles
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bundles
          path: app/vst/build/FroggersVst_artefacts/Release/*.zip
          if-no-files-found: error

  # The Windows VST3. Mirrors desktop-release.yml's own windows-latest job,
  # which is the only Windows build this repository has ever run green --
  # every step below is either identical to one of its steps or is called out
  # as a first attempt.
  #
  # FIRST ATTEMPTS, with no working equivalent anywhere in this repository:
  # configuring app/vst on Windows (desktop-release.yml configures
  # app/standalone there, a different CMakeLists), building the VST3 format
  # target on Windows, the Resources layout the doc-copy writes into a Windows
  # VST3 bundle, and running the ctest suite there -- these tests have only
  # ever run on macOS. A failure in those four is expected discovery, not a
  # surprise. Everything else -- the checkout, the JUCE clone, the
  # Compress-Archive packaging, the artifact upload -- is copied from a job
  # that already passes.
  build-and-test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # Same submodule fix desktop-release.yml's Windows job carries
          # (72700a9): app/vst links Sheaf's synth core.
          submodules: recursive

      - name: Fetch JUCE (pinned, matches the macOS job above)
        run: git clone --branch 8.0.12 --depth 1 https://github.com/juce-framework/JUCE.git "$HOME/JUCE"

      # No -DCMAKE_BUILD_TYPE juggling beyond the macOS job's: CMake's default
      # Windows generator resolves to MSVC, which is what JUCE is tested
      # against and what desktop-release.yml already relies on here.
      - name: Configure
        run: cmake -S app/vst -B app/vst/build -DCMAKE_BUILD_TYPE=Release

      # --parallel 2, not `-- -j2`: everything after `--` goes to the native
      # build tool, and this generator's is MSBuild, which spells it /m and
      # fails with MSB1001 rather than ignoring it. Same line, same reason, as
      # desktop-release.yml's Windows build step.
      #
      # Only VST3 is named. AU is not in FROGGERS_VST_FORMATS off macOS, so
      # FroggersVst_AU does not exist as a target here and naming it would
      # fail the build on a format the platform cannot produce.
      - name: Build (VST3)
        run: |
          cmake --build app/vst/build --config Release --parallel 2
          cmake --build app/vst/build --config Release --target FroggersVst_VST3 --parallel 2

      # A Windows VST3 is a directory bundle, like the macOS one, so this is
      # `test -d` exactly as the macOS job asserts -- but only VST3, since no
      # .component is produced here.
      - name: Assert plugin bundle was built
        run: |
          test -d app/vst/build/FroggersVst_artefacts/Release/VST3/Frogg3rs.vst3
          echo "Windows VST3 bundle present"

      # -C Release, unlike the macOS job: this generator is multi-config, so
      # ctest cannot tell which configuration to run and reports every test as
      # "Not Run -- Test not available without configuration". The macOS job's
      # generator is single-config and takes the configuration from the build
      # directory itself.
      #
      # Four registered tests here, not the macOS job's five: no AU target
      # means no FroggersVstDocsBundled_AU.
      - name: ctest
        run: ctest --test-dir app/vst/build --build-config Release --output-on-failure

      # The three JUCE-linked binaries exit within a second while the
      # pure-CMake docs check passes, and ctest prints nothing from them before
      # they go -- which is what a process dying before it reaches its own
      # first write looks like. Two families of cause fit that, and the exit
      # code is the only thing here that separates them: 0xC0000005 is an
      # access violation inside code that ran, 0xC0000135/0xC0000139 is an
      # image whose dependencies never resolved, so nothing ran at all.
      #
      # Each is also run a second time from its own directory. Windows
      # searches the executable's directory for DLLs before PATH, and ctest
      # invokes these from the build root instead, so a difference between the
      # two exit codes localises the fault to a missing sibling DLL rather
      # than to the code.
      - name: Diagnose the test binaries
        if: always()
        shell: pwsh
        run: |
          $names = @("FroggersVstSmokeTest", "FroggersVstHostTests", "FroggersVstEditorTest")
          Write-Host "--- every exe produced by the build ---"
          Get-ChildItem -Recurse -Filter *.exe app/vst/build |
            ForEach-Object { Write-Host $_.FullName }
          Write-Host "--- every dll produced by the build ---"
          Get-ChildItem -Recurse -Filter *.dll app/vst/build |
            ForEach-Object { Write-Host $_.FullName }
          foreach ($name in $names) {
            $exe = Get-ChildItem -Recurse -Filter "$name.exe" app/vst/build |
              Select-Object -First 1
            if (-not $exe) { Write-Host "=== $name : NOT BUILT ==="; continue }
            Write-Host "=== $name ==="
            Write-Host "path: $($exe.FullName)"
            Write-Host "-- run from the build root, as ctest does --"
            & $exe.FullName 2>&1 | Select-Object -First 25 | ForEach-Object { Write-Host $_ }
            $fromRoot = $LASTEXITCODE
            Write-Host ("exit: {0} (0x{1:X8})" -f $fromRoot, $fromRoot)
            Write-Host "-- run from its own directory --"
            Push-Location $exe.DirectoryName
            & $exe.FullName 2>&1 | Select-Object -First 25 | ForEach-Object { Write-Host $_ }
            $fromOwnDir = $LASTEXITCODE
            Pop-Location
            Write-Host ("exit: {0} (0x{1:X8})" -f $fromOwnDir, $fromOwnDir)
          }

      # Compress-Archive, not ditto: ditto is macOS-only. Same packaging step
      # desktop-release.yml's Windows job uses, pointed at a directory rather
      # than a single .exe.
      - name: Package plugin bundle
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path app/vst/build/FroggersVst_artefacts/Release/VST3/Frogg3rs.vst3 -DestinationPath dist/Frogg3rs-VST3-windows.zip

      - name: Upload packaged bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bundles-windows
          path: dist/Frogg3rs-VST3-windows.zip
          if-no-files-found: error

  # Publishes only for the plugin tag, and only after build-and-test passed:
  # `needs` makes a failing suite block the release rather than shipping past
  # it. The per-commit check above keeps its read-only permissions; write
  # access is scoped to this job alone.
  release:
    # Both build jobs gate the release: it must not claim platform coverage it
    # does not have, so a red Windows job blocks it exactly as a red macOS one
    # would.
    needs: [build-and-test, build-and-test-windows]
    if: startsWith(github.ref, 'refs/tags/frogg3rs_vst')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin-bundles
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: plugin-bundles-windows
          path: dist

      # The opening steps come from MANUAL.md's "Opening a downloaded build"
      # and "Why the extra step is permanent" subsections, the same extraction
      # desktop-release.yml uses, so they have one source. The install paths
      # are plugin-specific and stay inline here.
      - name: Write release notes
        run: |
          awk '/^### Opening a downloaded build$/{flag=1} /^### Installing the Android app$/{flag=0} /^## /{flag=0} /^---$/{flag=0} flag' MANUAL.md > opening-notes.md
          {
            echo "Contains VST3 and Audio Unit builds for macOS, and a VST3 for Windows."
            echo "The Audio Unit is macOS-only because the format is."
            echo
            echo "Install by unzipping into:"
            echo "- macOS VST3: ~/Library/Audio/Plug-Ins/VST3/"
            echo "- macOS AU:   ~/Library/Audio/Plug-Ins/Components/"
            echo "- Windows VST3: %ProgramFiles%\\Common Files\\VST3\\"
            echo
            echo "The Windows VST3 is unsigned -- no Authenticode certificate exists for"
            echo "this project, exactly as for the Windows standalone. Windows may warn on"
            echo "first load."
            echo
            cat opening-notes.md
            echo
            echo "How to use Frogg3rs: [MANUAL.md](https://github.com/$GITHUB_REPOSITORY/blob/main/MANUAL.md)."
          } > release-notes.md

      # gh is preinstalled on the runner, so the release needs no third-party
      # action.
      - name: Publish plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same shape as desktop-release.yml's publish step, and for the
          # same reason: the trigger is one FIXED tag, so re-pointing it at a
          # newer commit runs this again, and `gh release create` fails when
          # a release for that tag already exists. Publishing a second plugin
          # build is the normal case.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Frogg3rs audio plugin — $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "Frogg3rs audio plugin — $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
