name: Android App

on:
  push:
    # Same paths-ignore as pages.yml, so an openspec/README-only push does
    # not trigger this build.
    branches: [main]
    tags: ['frogg3rs_android']
    paths-ignore: ['openspec/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # JUCE's own Linux Dependencies list for building Projucer and a JUCE
      # GUI application on Linux.
      - name: Install JUCE's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      # Pinned to match app/android/build-android.sh's own header comment
      # and every other workflow in this repository that builds against JUCE
      # (desktop-release.yml, vst-plugin.yml): 8.0.12 is the only version
      # this app is developed and verified against.
      - name: Fetch JUCE (pinned, matches this app's locally-verified checkout)
        run: git clone --branch 8.0.12 --depth 1 https://github.com/juce-framework/JUCE.git "$HOME/JUCE"

      # app/android/Frogg3rs.jucer's own EXPORTFORMATS comment records task
      # 4.2's toolchain measurement: Gradle 9.1.0 with Android Gradle plugin
      # 8.13.2, the first candidate pair that built on Java 25, is what the
      # committed .jucer carries -- so this job installs the JDK that pair
      # runs on, not the Java 17 / Gradle 8.11.1 fallback pair 4.2 never
      # needed here.
      - name: Setup Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Built the same way app/android/Frogg3rs.jucer's own header comment
      # describes for a local build: JUCE's own CMake,
      # JUCE_BUILD_EXTRAS, outside both repositories, at most two compile
      # jobs at once, niced. The Projucer binary's exact path under the
      # build tree is generator- and platform-dependent, so it is found
      # rather than assumed. --set-global-search-path matches every MODULE
      # in the .jucer having useGlobalPath="1".
      - name: Build Projucer
        run: |
          cmake -S "$HOME/JUCE" -B "$HOME/juce-build" -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_BUILD_EXTRAS=ON -DJUCE_BUILD_EXAMPLES=OFF
          nice cmake --build "$HOME/juce-build" --target Projucer --parallel 2
          PROJUCER="$(find "$HOME/juce-build" -type f -name Projucer -perm -u+x | head -1)"
          if [ -z "$PROJUCER" ]; then
            echo "::error::Projucer binary not found under $HOME/juce-build" >&2
            exit 1
          fi
          "$PROJUCER" --set-global-search-path linux defaultJuceModulePath "$HOME/JUCE/modules"
          echo "PROJUCER=$PROJUCER" >> "$GITHUB_ENV"

      # design.md, "Release": Projucer applies one signing config, default
      # the debug keystore, to BOTH build types (the release APK is
      # re-signed for real by sign-apk.sh later). That default keystore is
      # the standard Android debug one at ~/.android/debug.keystore --
      # normally created the first time Android Studio or the SDK tooling
      # runs, which is why the operator's Mac already has one and a bare
      # runner does not: Gradle's validateSigningDebug_Debug task fails
      # outright ("Keystore file ... not found") without it. Generated here
      # with the well-known, non-secret debug-keystore recipe every Android
      # toolchain uses (alias androiddebugkey, password "android").
      - name: Generate the Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # app/android/build-android.sh resaves the .jucer and runs Gradle's
      # assemble step, at most two Gradle compile jobs at once, niced, same
      # as every build this repository runs on the operator's Mac. Debug
      # first: its own applicationId assertion is the fastest real signal
      # that the resaved project is sound before spending the release build.
      #
      # The built APK is copied out to dist/ before the next resave: a bare
      # `Projucer --resave` (confirmed locally, no Gradle involved) deletes
      # the whole app/build output directory as part of regenerating the
      # module, so building release right after debug would otherwise erase
      # the debug APK before this job ever uploads it; the debug APK is
      # copied out right after its own build.
      - name: Build debug APK
        run: |
          app/android/build-android.sh debug
          DEBUG_APK="$(find app/android/Builds/Android/app/build/outputs/apk -ipath '*debug*' -iname '*.apk' | head -1)"
          if [ -z "$DEBUG_APK" ]; then
            echo "::error::debug APK not found under app/android/Builds/Android/app/build/outputs/apk" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$DEBUG_APK" dist/Frogg3rs-debug.apk

      - name: Build release APK
        run: |
          app/android/build-android.sh release
          RELEASE_APK="$(find app/android/Builds/Android/app/build/outputs/apk -ipath '*release*' -iname '*.apk' | head -1)"
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::release APK not found under app/android/Builds/Android/app/build/outputs/apk" >&2
            exit 1
          fi
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

      # design.md, "Release": Projucer applies one signing config (the debug
      # keystore) to both build types, so the release APK Gradle just built
      # is still debug-signed. app/android/sign-apk.sh strips that
      # signature and re-signs for real, from a keystore this job never
      # commits to the repository: the release secrets below on the
      # frogg3rs_android tag, a key generated for this run everywhere else
      # (including this push, which is not that tag).
      - name: Generate a throwaway release-signing key
        if: "!startsWith(github.ref, 'refs/tags/frogg3rs_android')"
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-release.keystore" \
            -alias ci-release -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-release-passphrase -keypass ci-release-passphrase \
            -dname "CN=frogg3rs CI, OU=CI, O=frogg3rs, L=CI, ST=CI, C=US"
          echo "KEYSTORE=$RUNNER_TEMP/ci-release.keystore" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=ci-release" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=ci-release-passphrase" >> "$GITHUB_ENV"

      # Never reached on this push (it is not the frogg3rs_android tag), so
      # FROGG3RS_RELEASE_KEYSTORE_B64 and FROGG3RS_RELEASE_KEYSTORE_PASSWORD
      # are read only when the tag build actually needs them.
      - name: Decode the release signing key
        if: startsWith(github.ref, 'refs/tags/frogg3rs_android')
        env:
          FROGG3RS_RELEASE_KEYSTORE_B64: ${{ secrets.FROGG3RS_RELEASE_KEYSTORE_B64 }}
          FROGG3RS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.FROGG3RS_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$FROGG3RS_RELEASE_KEYSTORE_B64" ] || [ -z "$FROGG3RS_RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::FROGG3RS_RELEASE_KEYSTORE_B64 and FROGG3RS_RELEASE_KEYSTORE_PASSWORD must both be set to sign the frogg3rs_android tag" >&2
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$FROGG3RS_RELEASE_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          # sign-apk.sh needs one alias, and this repository names no
          # secret for it: the keystore this secret decodes to is read for
          # its sole entry instead, which sign-apk.sh's own post-sign check
          # already requires to exist (exactly one signer).
          ENTRIES="$(keytool -list -keystore "$KEYSTORE" -storepass "$FROGG3RS_RELEASE_KEYSTORE_PASSWORD" \
            | grep -E ', (PrivateKeyEntry|trustedCertEntry)' || true)"
          ENTRY_COUNT="$(printf '%s\n' "$ENTRIES" | grep -c . || true)"
          if [ "$ENTRY_COUNT" -ne 1 ]; then
            echo "::error::expected exactly one entry in the release keystore, found $ENTRY_COUNT" >&2
            exit 1
          fi
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$(printf '%s\n' "$ENTRIES" | cut -d, -f1)" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$FROGG3RS_RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Sign the release APK
        run: |
          mkdir -p dist
          app/android/sign-apk.sh "$RELEASE_APK" dist/Frogg3rs-android.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: frogg3rs-android-debug
          path: dist/Frogg3rs-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: frogg3rs-android-release
          path: dist/Frogg3rs-android.apk
          if-no-files-found: error

  release:
    # Publishes only for the release tag, the same guard desktop-release.yml
    # and vst-plugin.yml use: without it a manual dispatch or the temporary
    # android-app branch trigger above would reach `gh release create` and
    # cut a release from whatever ref triggered the run.
    needs: build
    if: startsWith(github.ref, 'refs/tags/frogg3rs_android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: frogg3rs-android-release
          path: dist

      # Written for the release page itself: how to install the APK attached
      # below it, and where the manual is. MANUAL.md's own install section
      # links to this page, which reads wrong on this page, and extracting it
      # ran on into the manual's next section.
      - name: Write release notes
        run: |
          {
            echo "Download \`Frogg3rs-android.apk\` below on your phone and open it. Android asks whether to let"
            echo "your browser install apps: allow it, then install. A newer APK installs over the old one."
            echo
            echo "How to use Frogg3rs: [MANUAL.md](https://github.com/$GITHUB_REPOSITORY/blob/main/MANUAL.md)."
          } > release-notes.md

      # Create-or-update shape of desktop-release.yml's own publish step:
      # this tag is fixed (not a pattern), so a re-point of it re-runs this
      # job, and `gh release create` fails once a release for the tag
      # already exists.
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Frogg3rs-android.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Frogg3rs Android — $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/Frogg3rs-android.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Frogg3rs Android — $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
