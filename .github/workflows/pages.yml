name: GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['openspec/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"

      # emsdk version pinned to match the toolchain build-browser.sh's own
      # header comment records as verified-working for this app
      # (app/browser/build-browser.sh:19-20, checked 2026-08-18) -- not
      # Sheaf's own CI pin (6.0.3, .github/workflows/synth-browser-pages.yml
      # in External/Sheaf), which was never exercised against this app.
      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.7

      # Group-2 build: Sheaf's generic browser pipeline, out-of-tree, no
      # Sheaf-side change (app/browser/build-browser.sh).
      - name: Build browser app (frogg3rs via Sheaf)
        run: |
          cd app/browser
          ./build-browser.sh

      # froggers-browser-package spec, "Immutable, content-addressed
      # package": proves the build identifier is a pure function of
      # artifact bytes (same inputs -> same id; changed inputs -> changed
      # id). Hermetic -- operates on copies of the already-built wasm
      # output in a temp dir, no server, no rebuild. Previously only a
      # local `make determinism-test` target, never run in CI.
      - name: Package determinism test
        run: |
          cd app/browser
          node test-package-determinism.mjs

      # Task 4.1: package artifacts + self-hosted catalog, then the
      # RENAMED-ORIGIN GATE over the assembled output.
      - name: Assemble package + catalog
        run: |
          cd app/browser
          node package-catalog.mjs
          ./check-renamed-origin.sh dist/site

      # Task 4.1's local-smoke sequence: re-packages (deterministically --
      # see the determinism test above), re-gates, serves the assembled
      # site on loopback (127.0.0.1:8787), and runs Sheaf's own
      # deployed-catalog validator against it over that loopback URL --
      # validate-deployed-catalog.mjs explicitly allows loopback for local
      # tests (local-smoke.sh's own header comment), so this needs no
      # deployed origin and is fully CI-runnable. Previously only a local
      # `make local-smoke` / `make package-test` target, never run in CI.
      - name: Local smoke (serve + Sheaf catalog validator)
        run: |
          cd app/browser
          ./local-smoke.sh

      # Task 4.3: Playwright e2e for the new site, its own harness under
      # app/browser/e2e/ (own package.json
      # stays dormant, untouched, and byte-identical). Serves the
      # already-assembled dist/site (no rebuild) and runs both the
      # mobile-emulated and desktop-emulated projects. The mobile-emulated
      # stacking assertions (e2e/mobile-stacking.spec.mjs) are real, active
      # tests: the surface lays out its own phone arrangement from the width
      # app/browser/site/viewport-width.mjs reports, and the full suite runs
      # and passes. Chromium only.
      - name: Browser e2e (Playwright)
        run: |
          cd app/browser/e2e
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --workers=1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/browser/dist/site

  # DEPLOY GATED ON MAIN: a workflow_dispatch from any other ref runs
  # build-and-test only (the pre-main dry run); this job only runs for
  # refs/heads/main, so it never fires on a branch dispatch even though
  # `on: workflow_dispatch` has no ref restriction of its own. `on: push`
  # is already main-only, so branch pushes never reach either job.
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
