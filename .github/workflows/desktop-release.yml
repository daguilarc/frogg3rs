name: Desktop Release

on:
  push:
    tags:
      - 'frogg3rs_v2'
  # Lets the build jobs run without cutting a release, which is how the
  # Windows port gets driven forward: the only other trigger is the release
  # tag itself, so before this the choice was publish or do not build. The
  # release job below is guarded on the tag, so a manual dispatch builds and
  # packages but never publishes.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch JUCE (pinned, matches app/vst's locally-verified checkout)
        run: git clone --branch 8.0.12 --depth 1 https://github.com/juce-framework/JUCE.git "$HOME/JUCE"

      # app/build-launcher.sh is the actual, only entry point that builds the
      # standalone: it drives External/Sheaf/projects/synth's sheaf-patch
      # Makefile with the Froggers app injected out-of-tree and produces
      # app/build-launcher/Frogg3rs.app.
      - name: Build standalone (Frogg3rs.app)
        run: ./app/build-launcher.sh

      - name: Assert app bundle was built
        run: test -d app/build-launcher/Frogg3rs.app

      - name: Package DMG
        run: |
          mkdir -p dist
          hdiutil create -volname Frogg3rs -srcfolder app/build-launcher/Frogg3rs.app -ov -format UDZO dist/Frogg3rs-macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/Frogg3rs-macOS.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch JUCE (pinned, matches app/vst's locally-verified checkout)
        run: git clone --branch 8.0.12 --depth 1 https://github.com/juce-framework/JUCE.git "$HOME/JUCE"

      # app/standalone/CMakeLists.txt, not External/Sheaf's juce_build.mk:
      # that Makefile drives x86_64-w64-mingw32-g++ on this runner, and
      # MinGW g++ cannot compile JUCE's own headers here -- memcpy/memset
      # missing from std:: and pointer_sized_int resolving to 32-bit int on
      # a 64-bit target, confirmed against a real run of this job before
      # this change (see app/standalone/CMakeLists.txt's own header comment
      # for the exact errors and files). CMake's default Windows generator
      # resolves to MSVC instead, which is what JUCE is actually tested
      # against. No continue-on-error: if this fails, the job fails, and
      # that failure is real information about the port.
      - name: Configure
        run: cmake -S app/standalone -B app/standalone/build -DCMAKE_BUILD_TYPE=Release

      # --parallel, not `-- -j2`: everything after `--` goes to the native
      # build tool, and this generator's is MSBuild, which has no -j switch
      # (it spells it /m) and fails with MSB1001 rather than ignoring it.
      # --parallel is CMake's own flag and translates per generator, so the
      # same line works whichever one is picked.
      - name: Build standalone (Frogg3rs.exe)
        run: cmake --build app/standalone/build --config Release --parallel 2

      - name: Assert binary was built
        run: test -f app/standalone/build/FroggersStandalone_artefacts/Release/Frogg3rs.exe

      - name: Package Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path app/standalone/build/FroggersStandalone_artefacts/Release/Frogg3rs.exe -DestinationPath dist/Frogg3rs-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/Frogg3rs-windows.zip
          if-no-files-found: error

  release:
    # Both build jobs gate the release: a release must not claim platform
    # coverage it does not have, so a red Windows job blocks it exactly like
    # a red macOS job would. This only bites at release time -- the workflow
    # fires on the frogg3rs_v2 tag or a manual dispatch (see the triggers
    # above), and the release job below is additionally gated on that tag,
    # so this coupling cannot block an ordinary push.
    needs: [build-macos, build-windows]
    # Publishes only for the release tag. Without this a manual dispatch
    # would reach `gh release create` and cut a release named after whatever
    # ref was dispatched -- same guard vst-plugin.yml's own release job uses.
    if: startsWith(github.ref, 'refs/tags/frogg3rs_v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist

      # What is attached, how to open an unsigned build, and where the manual
      # is. The opening steps come from MANUAL.md's "Opening a downloaded
      # build" and "Why the extra step is permanent" subsections, so they have
      # one source; the rest of its "Release platforms" section describes the
      # other releases and does not belong on this page.
      - name: Write release notes
        run: |
          awk '/^### Opening a downloaded build$/{flag=1} /^### Installing the Android app$/{flag=0} /^## /{flag=0} /^---$/{flag=0} flag' MANUAL.md > opening-notes.md
          {
            echo "\`Frogg3rs-macOS.dmg\` (macOS) and \`Frogg3rs-windows.zip\` (Windows) are attached below."
            echo
            cat opening-notes.md
            echo
            echo "How to use Frogg3rs: [MANUAL.md](https://github.com/$GITHUB_REPOSITORY/blob/main/MANUAL.md)."
          } > release-notes.md

      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The trigger is one FIXED tag, not a pattern, so this step runs
          # again every time that tag is re-pointed at a newer commit -- and
          # `gh release create` fails outright when a release for the tag
          # already exists. Publishing a second desktop build is the normal
          # case, not an edge case, so handle both: update the existing
          # release in place, or create it the first time.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/Frogg3rs-macOS.dmg dist/Frogg3rs-windows.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Frogg3rs desktop — $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/Frogg3rs-macOS.dmg dist/Frogg3rs-windows.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "Frogg3rs desktop — $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
