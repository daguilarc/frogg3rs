apply plugin: 'com.android.application'

// Test-only: debug build type only, default (auto-generated) debug signing,
// no native code. See ../settings.gradle for why this exists and how it is
// built.
android {
    compileSdk 35
    namespace "io.github.daguilarc.frogg3rs.miditest"

    defaultConfig {
        applicationId "io.github.daguilarc.frogg3rs.miditest"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
