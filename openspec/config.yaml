schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  tasks:
    - A task that edits user docs (MANUAL.md, QUICK_DICT.md, README.md, DAISY_MANUAL.md) states
      the present behavior for a first-time reader who never saw an earlier version, with no
      implementation report.
    - Its check is two reader questions, answered per changed sentence by a context that wrote
      none of it: does a first-time user, who never saw an earlier version, need this to use the
      control, and is it true against the code?
